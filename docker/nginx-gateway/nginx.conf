server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header traceparent $http_traceparent;
  proxy_set_header x-correlation-id $http_x_correlation_id;

  location = /admin {
    return 302 /admin/;
  }

  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    proxy_pass http://admin-frontend.local-app.svc.cluster.local;
  }

  location /api/auth/ {
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://auth-service.local-app.svc.cluster.local:8000;
  }

  location /api/profile/ {
    rewrite ^/api/profile/(.*)$ /$1 break;
    proxy_pass http://profile-service.local-app.svc.cluster.local:8000;
  }

  location / {
    proxy_pass http://frontend.local-app.svc.cluster.local;
  }
}

