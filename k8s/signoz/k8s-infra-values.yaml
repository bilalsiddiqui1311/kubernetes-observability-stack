global:
  cloud: other
  clusterName: local-platform
  deploymentEnvironment: local

clusterName: local-platform
otelCollectorEndpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318
otelInsecure: true

presets:
  otlphttpExporter:
    enabled: true
  loggingExporter:
    enabled: false
  logsCollection:
    enabled: true
    blacklist:
      enabled: true
      signozLogs: true
      namespaces:
        - kube-system
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
  clusterMetrics:
    enabled: true
  k8sEvents:
    enabled: true
  prometheus:
    enabled: true
    annotationsPrefix: signoz.io
    namespaces:
      - local-app
