apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: local-app
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tags.datadoghq.com/env: local
        tags.datadoghq.com/service: auth-service
        tags.datadoghq.com/version: dev
      annotations:
        newrelic.io/scrape: "true"
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        signoz.io/scrape: "true"
        signoz.io/path: /metrics
        signoz.io/port: "8000"
        ad.datadoghq.com/auth-service.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:%%port%%/metrics",
                  "namespace": "local_app",
                  "metrics": [
                    "http_requests_total",
                    "http_request_duration_seconds.*",
                    "login_attempts_total",
                    "db_query_duration_seconds.*",
                    "frontend_.*"
                  ]
                }
              ]
            }
          }
    spec:
      containers:
        - name: auth-service
          image: local/auth-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: auth-service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://app:$(POSTGRES_PASSWORD)@postgres.local-app.svc.cluster.local:5432/appdb
            - name: PROFILE_SERVICE_URL
              value: http://profile-service.local-app.svc.cluster.local:8000
            - name: LOGSTASH_URL
              value: http://logstash.observability.svc.cluster.local:8080
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 800m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: local-app
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
