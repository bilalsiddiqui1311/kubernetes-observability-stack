apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: local-app
  labels:
    app: admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
        - name: admin-frontend
          image: local/admin-frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: local-app
spec:
  selector:
    app: admin-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

